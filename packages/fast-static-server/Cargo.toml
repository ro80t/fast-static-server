description = "Routing/handler library for fast-static-server, an axum-based static file server (Rust port of npm `serve`)."
keywords = ["http", "static-server", "axum", "file-server"]
categories = ["web-programming::http-server", "filesystem"]

[dependencies]
tokio = { workspace = true, features = ["macros", "rt", "fs"] }
