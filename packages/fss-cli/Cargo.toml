[package]
name = "fss-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "CLI for fast-static-server: serve a directory over HTTP, a fast Rust port of npm `serve`."
keywords = ["cli", "static-server", "http-server", "serve"]
categories = ["command-line-utilities", "web-programming::http-server"]

[[bin]]
name = "fast-static-server"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }
clap.workspace = true
axum.workspace = true
fast-static-server.workspace = true
