name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --verbose

      - name: Test
        run: cargo test --workspace --verbose

      - name: Publish dry-run (fast-static-server)
        run: cargo publish --dry-run --no-verify -p fast-static-server

      - name: Publish dry-run (fss-cli)
        # fails until fast-static-server's first real publish exists on crates.io;
        # drop continue-on-error once that's done
        run: cargo publish --dry-run --no-verify -p fss-cli
        continue-on-error: true

  js-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: oxlint
        run: bun run lint

      - name: oxfmt check
        run: bun run format:check
